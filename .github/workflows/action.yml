name: CI

on:
  push:
  pull_request:

jobs:
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Run Trivy
        uses: aquasec/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error

  ci:
    name: Test on Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [trivy, semgrep]
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]

    env:
      LANG: it_IT.UTF-8
      LC_ALL: it_IT.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Set up Python
        uses: actions/setup-python@4665351e60be76a4296400986a7ef6535f186ab3
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configure locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales netcat-openbsd curl
          sudo locale-gen it_IT.UTF-8
          sudo update-locale LANG=it_IT.UTF-8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --with dev --no-interaction

      - name: Start services
        run: |
          docker compose --env-file tests/.env-test up -d --build

      - name: Wait for Mongo
        run: |
          for i in {1..60}; do
            if nc -z localhost 10002; then
              echo "Mongo is ready"
              exit 0
            fi
            echo "Waiting for Mongo... ($i/60)"
            sleep 2
          done

          echo "Mongo did not become ready in time"
          docker compose ps
          docker compose logs database || true
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..60}; do
            if nc -z localhost 10003; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/60)"
            sleep 2
          done

          echo "Redis did not become ready in time"
          docker compose ps
          docker compose logs redis_cache || true
          exit 1

      - name: Wait for Keycloak
        run: |
          for i in {1..90}; do
            if curl -fsS "http://localhost:10765/realms/test/.well-known/openid-configuration" > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "Waiting for Keycloak... ($i/90)"
            sleep 2
          done

          echo "Keycloak did not become ready in time"
          docker compose ps
          docker compose logs keycloak-ozn-test || true
          exit 1

      - name: Run tests
        run: |
          poetry run pytest --cov --cov-report=xml -vv

      - name: Show docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs || true

      - name: Stop services
        if: always()
        run: |
          docker compose --env-file tests/.env-test down -v --remove-orphans

      - name: Coveralls
        if: matrix.python-version == '3.14'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install coveralls
          coveralls --service=github
