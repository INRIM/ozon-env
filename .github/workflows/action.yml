name: CI

on:
  push:
  pull_request:

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Semgrep
        continue-on-error: true
        run: |
          # semgrep ci esce non-zero se trovo finding blocking (config auto
          # = ruleset pubblico, niente SEMGREP_APP_TOKEN richiesto).
          docker run --rm -v "$PWD:/src" -w /src returntocorp/semgrep:1.170.1 \
            semgrep ci --config auto

  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Trivy (fs)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.73.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

  ci:
    name: Test on Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [trivy, semgrep]
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]

    env:
      LANG: it_IT.UTF-8
      LC_ALL: it_IT.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configure locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales netcat-openbsd curl
          sudo locale-gen it_IT.UTF-8
          sudo update-locale LANG=it_IT.UTF-8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --with dev --no-interaction

      - name: Start services
        run: |
          docker compose --env-file tests/.env-test up -d --build

      - name: Wait for Mongo
        run: |
          for i in {1..60}; do
            if nc -z localhost 10002; then
              echo "Mongo is ready"
              exit 0
            fi
            echo "Waiting for Mongo... ($i/60)"
            sleep 2
          done

          echo "Mongo did not become ready in time"
          docker compose ps
          docker compose logs database || true
          exit 1

      - name: Wait for Redis
        run: |
          for i in {1..60}; do
            if nc -z localhost 10003; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i/60)"
            sleep 2
          done

          echo "Redis did not become ready in time"
          docker compose ps
          docker compose logs redis_cache || true
          exit 1

      - name: Wait for Keycloak
        run: |
          for i in {1..90}; do
            if curl -fsS "http://localhost:10765/realms/test/.well-known/openid-configuration" > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "Waiting for Keycloak... ($i/90)"
            sleep 2
          done

          echo "Keycloak did not become ready in time"
          docker compose ps
          docker compose logs keycloak-ozn-test || true
          exit 1

      - name: Run tests
        run: |
          poetry run pytest --cov --cov-report=xml -vv

      - name: Show docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs || true

      - name: Stop services
        if: always()
        run: |
          docker compose --env-file tests/.env-test down -v --remove-orphans

      - name: Coveralls
        if: matrix.python-version == '3.14'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install coveralls
          coveralls --service=github
