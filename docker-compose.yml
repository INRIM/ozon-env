services:

  database:
    # Pin allineato a ozon-env-app (database/Dockerfile-mongo). NB: le build
    # da 8.0.29 / 8.3.x in poi non partono su kernel Linux >= 6.19
    # (SERVER-121912, Docker Desktop con kernel linuxkit 7.x): li' serve
    # MONGO_VERSION=8.0.1.
    image: mongo:${MONGO_VERSION:-8.2.12}
    restart: always
    env_file:
      - ./tests/.env-test
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "10002:27017"

  keycloak-ozn-test:
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
      - --import-realm
      - --hostname=localhost
    env_file:
      - ./tests/.env-test
    ports:
      - "10765:8080"
    volumes:
      - ./tests/keycloak/realm:/opt/keycloak/data/import

  redis_cache:
    image: redis:latest
    command: redis-server --maxmemory 100mb  --maxmemory-policy allkeys-lfu --appendonly no --stop-writes-on-bgsave-error no --lfu-log-factor 10 --lfu-decay-time 1
    ports:
      - "10003:6379"
